<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oxy8</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect x='2' y='1' width='4' height='4' fill='%23f2f5f8'/%3E%3Crect x='3' y='2' width='3' height='2' fill='%231c8fc4'/%3E%3Crect x='2' y='5' width='4' height='2' fill='%23e8edf2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="app">
      <div id="game">
        <canvas id="screen" width="320" height="180" tabindex="0" aria-label="Oxy8 speelveld"></canvas>

        <section class="panel" id="stats" aria-label="Status">
          <div>O2 <span class="bar"><i id="o2-bar"></i></span><span id="o2-val">100</span></div>
          <div>EN <span class="bar"><i id="en-bar" class="energy"></i></span><span id="en-val">30</span></div>
          <div id="lamp">Lamp aan · F</div>
          <div id="inventory"></div>
        </section>

        <section class="panel" id="mission" aria-label="Missie">
          <div id="planet-name"></div>
          <div id="clock"></div>
          <div>Onderdelen <span id="slots"></span></div>
          <div id="hazard"></div>
        </section>

        <div class="panel" id="tip" role="status" aria-live="polite" hidden><span class="tip-label">Tip</span><span class="tip-text"></span></div>
        <div class="panel" id="toast" role="status" aria-live="polite"></div>
        <div class="panel" id="hint"></div>
        <div class="panel" id="keys" aria-label="Toetsen">
          <span><kbd>WASD</kbd> lopen</span>
          <span><kbd>E</kbd> actie</span>
          <span><kbd>F</kbd> lamp</span>
          <span data-item="bottle"><kbd>Q</kbd> fles</span>
          <span data-item="beacon"><kbd>R</kbd> baken</span>
          <span><kbd>M</kbd> geluid</span>
          <span><kbd>N</kbd> muziek</span>
          <span><kbd>H</kbd> verberg</span>
        </div>
        <canvas class="panel" id="minimap" aria-label="Minikaart"></canvas>

        <section id="starmap" hidden aria-label="Schip">
          <div id="starmap-title">Schip</div>
          <div class="section-title">Werkbank</div>
          <div id="workbench-sub"></div>
          <div id="workbench-list"></div>
          <div class="section-title">Sterrenkaart</div>
          <div id="starmap-sub"></div>
          <div id="starmap-list"></div>
          <div id="starmap-foot"></div>
        </section>

        <div id="overlay">
          <div id="overlay-title">Oxy8</div>
          <div id="overlay-hazard"></div>
          <div id="overlay-sub"></div>
          <div id="overlay-actions"></div>
          <div id="overlay-keys">WASD of pijltjes: lopen · E vasthouden: openen, inbouwen, schip · F: helmlamp · Q: zuurstoffles · R: lokbaken · M: geluid · N: muziek · H: toetsen</div>
        </div>
      </div>

      <nav id="debug" hidden>
        <button id="dbg-time" type="button">Tijd x20</button>
        <button id="dbg-repair" type="button">Motor repareren</button>
        <button id="dbg-energy" type="button">Energie +50</button>
        <button id="dbg-tips" type="button">Tips resetten</button>
      </nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
